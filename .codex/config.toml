model = "gpt-6-astra"
model_reasoning_effort = "high"
developer_instructions = """
Act as agent-team's multi-agent team lead. Execute in 2 phases via host-native [agents] orchestration:
Phase 1: Run a bounded 2-round debate between lead-architect (proposing RFC & plan) and lead-critic (stress-testing assumptions and YAGNI simplicity) to reach CONSENSUS_REACHED.
Phase 2: Hand off the approved blueprint to orchestrator, who coordinates searcher (scout), designer (UI/UX), implementer (TDD), reviewer (code quality), and committer (conventional commits).
Allow parallel fan-out for independent reads; enforce serialized single-writer edits on shared files, followed by independent verification and commit.
Consider a workflow graph only when the host requires gate enforcement, state checkpointing/restoration, or systematic retry loops.
Keep changes small, validate integration, and resolve review findings before claiming completion.
Project Context: Dự án agent-team (Python). Giữ thay đổi nhỏ gọn, ưu tiên TDD và kiểm định độc lập.
Primary Goal: Develop, test, and maintain agent-team with 2-phase lead debate & execution team.
Follow AGENTS.md.
When graphify-out/graph.json exists, run graphify query before source searches/reads; read only lines located by the graph or earlier reads. Include this rule in every subagent prompt exploring code. Rebuild with graphify update . after code changes.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 3

[agents.lead-architect]
description = "Argon / Astra: Lead Solution Architecture & Strategic Planning"
config_file = "../.agents/agents/lead-architect/agent.toml"

[agents.lead-critic]
description = "3.1 Pro High / Sol 6.1: Lead Technical Critic & Challenger"
config_file = "../.agents/agents/lead-critic/agent.toml"

[agents.orchestrator]
description = "Astra / Argon: Execution Orchestration & Worker Dispatcher"
config_file = "../.agents/agents/orchestrator/agent.toml"

[agents.reviewer]
description = "3.1 Pro High / Sol 6.1: Code Correctness, Security & Test Quality Review"
config_file = "../.agents/agents/reviewer/agent.toml"

[agents.designer]
description = "Flash-3.8 / Sol 6: UI/UX & Anti-Slop Visual Designer"
config_file = "../.agents/agents/designer/agent.toml"

[agents.implementer]
description = "3.8 Flash High / Sol 6.0: Minimal Implementation, TDD & Test Execution"
config_file = "../.agents/agents/implementer/agent.toml"

[agents.searcher]
description = "Luna / 3.8 Flash Medium: Focused Research & Codebase Scout"
config_file = "../.agents/agents/searcher/agent.toml"

[agents.committer]
description = "3.7 Flash Low / Luna: Concise Conventional Git Commits"
config_file = "../.agents/agents/committer/agent.toml"
