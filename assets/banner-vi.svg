    <circle cx="48" cy="40" r="3" fill="#023c75"/>
    <text x="58" y="44" fill="#023c75" font-weight="800" letter-spacing="0.8">AGT // CLI v3.0</text>

    <!-- Palette Badge -->
    <rect x="170" y="28" width="220" height="24" rx="3" fill="#f4efe2" stroke="#c5bc9f" stroke-width="1"/>
    <circle cx="182" cy="40" r="3" fill="#685f10"/>
    <text x="192" y="44" fill="#685f10" font-weight="700" letter-spacing="0.6">OASIS STARLIGHT LIGHT</text>

    <!-- Cross-Harness Badge -->
    <rect x="398" y="28" width="196" height="24" rx="3" fill="#eee8da" stroke="#c5bc9f" stroke-width="1"/>
    <text x="408" y="44" fill="#4f4a23" font-weight="600" letter-spacing="0.5">.AGENTS • .CODEX • .CLAUDE</text>

    <!-- Topology Badge -->
    <rect x="602" y="28" width="224" height="24" rx="3" fill="#faeeee" stroke="#d59090" stroke-width="1"/>
    <circle cx="614" cy="40" r="3" fill="#9b0303"/>
    <text x="624" y="44" fill="#9b0303" font-weight="700" letter-spacing="0.5">ĐỘI NGŨ 2 PHA: LEAD &amp; TDD</text>

    <!-- Workspace Target -->
    <text x="1158" y="44" fill="#68707a" text-anchor="end" font-weight="600" letter-spacing="1">WORKSPACE // ~/PROJECTS</text>
  </g>

  <!-- 3. LEFT COLUMN: Hero Branding & Capability Engine -->
  <g transform="translate(36, 76)">
    <!-- Monogram Box -->
    <rect x="0" y="4" width="86" height="86" rx="6" fill="#fcfbfa" stroke="#3d648c" stroke-width="1.8" filter="url(#oaSoftShadowVi)"/>
    <rect x="6" y="10" width="74" height="74" rx="3" fill="none" stroke="#d5ccba" stroke-width="1"/>
    <text x="43" y="60" text-anchor="middle" fill="#023c75" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="34" font-weight="900" letter-spacing="-1">agt</text>
    <rect x="22" y="70" width="42" height="2.5" rx="1.2" fill="url(#oaSapphireVi)"/>

    <!-- Title & Tagline -->
    <text x="104" y="40" fill="#181811" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="38" font-weight="900" letter-spacing="-0.8">AGENT-TEAM</text>
    <rect x="378" y="16" width="62" height="22" rx="3" fill="#eaf2f8" stroke="#3d648c" stroke-width="1"/>
    <text x="409" y="31" text-anchor="middle" fill="#023c75" font-family="ui-monospace, monospace" font-size="11" font-weight="800" letter-spacing="1">v3.0</text>

    <text x="104" y="70" fill="#2a649f" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="700" letter-spacing="0.8">ĐIỀU PHỐI ĐỘI NGŨ AI &amp; SKILLS GENERATOR</text>

    <!-- Sleek Metallic Divider -->
    <line x1="0" y1="106" x2="520" y2="106" stroke="#d5ccba" stroke-width="1.2"/>
    <rect x="0" y="105" width="88" height="2.5" rx="1" fill="url(#oaSapphireVi)"/>

    <!-- Value Proposition -->
    <text x="0" y="136" fill="#353b45" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="14.5" font-weight="400">
      CLI Wizard thiết lập đội ngũ AI phân cấp, cô lập vai trò với cơ chế dự phòng
    </text>
    <text x="0" y="159" fill="#353b45" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="14.5" font-weight="400">
      đa nền tảng, giám sát tiến trình và <tspan fill="#023c75" font-family="ui-monospace, monospace" font-weight="700">AGENTS.md &lt; 150 dòng</tspan>.
    </text>

    <!-- Terminal Command Sandbox -->
    <rect x="0" y="184" width="520" height="52" rx="5" fill="#ece5d5" stroke="#c5bc9f" stroke-width="1.2" filter="url(#oaSoftShadowVi)"/>
    <circle cx="20" cy="210" r="3.5" fill="#9b0303"/>
    <circle cx="33" cy="210" r="3.5" fill="#685f10"/>
    <circle cx="46" cy="210" r="3.5" fill="#1d5c14"/>
    <text x="64" y="214" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5">
      <tspan fill="#023c75" font-weight="700">$ cd ~/du-an-vi-du</tspan>
      <tspan fill="#68707a"> &amp;&amp; </tspan>
      <tspan fill="#181811" font-weight="700">agt</tspan>
      <tspan fill="#68707a"> || </tspan>
      <tspan fill="#704931">agt fallback --step-down</tspan>
    </text>

    <!-- Harness Feature Pills -->
    <g transform="translate(0, 252)" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700">
