      <rect x="0" y="0" width="520" height="42" rx="4" fill="#eee8da" stroke="#c8c0ad" stroke-width="1"/>
      <text x="14" y="18" fill="#181811">KIẾN TRÚC: <tspan fill="#023c75" font-weight="700">Pha 1 (Lead Phản Biện) ➔ Pha 2 (Thực Thi TDD)</tspan></text>
      <text x="14" y="32" fill="#68707a">SKILLS ENGINE: <tspan fill="#1d5c14" font-weight="700">28+ Đã gắn</tspan> • <tspan fill="#685f10" font-weight="700">150+ Quét được</tspan> • Symlink / Copy Mode</text>
    </g>
