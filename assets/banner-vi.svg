      <rect x="0" y="0" width="166" height="32" rx="3" fill="#eaf2f8" stroke="#3d648c" stroke-width="1"/>
      <circle cx="14" cy="16" r="3.5" fill="#023c75"/>
      <text x="26" y="20" fill="#023c75">ANTIGRAVITY (`agy`)</text>

      <!-- Pill 2: Codex -->
