      <!-- Agent 06: Reviewer (shark) -->
      <g transform="translate(0, 176)">
        <rect x="0" y="0" width="276" height="66" rx="4" fill="url(#oaCardCriticBgVi)" stroke="#d59090" stroke-width="1.2" filter="url(#oaSoftShadowVi)"/>
        <rect x="0" y="0" width="4" height="66" rx="2" fill="#9b0303"/>
        <text x="12" y="16" fill="#181811" font-size="11" font-weight="800">06 REVIEWER 🦈</text>
        <rect x="188" y="6" width="78" height="15" rx="2.5" fill="#f5d5d5"/>
        <text x="227" y="16.5" text-anchor="middle" fill="#9b0303" font-size="8" font-weight="700">BẢO MẬT [RO]</text>
        <text x="12" y="32" fill="#68707a" font-size="9">shark • Kiểm Định Chuẩn Code &amp; An Toàn</text>
