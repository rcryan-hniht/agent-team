  <path d="M 1164 14 L 1186 14 L 1186 36" fill="none" stroke="#685f10" stroke-width="2.2"/>
  <path d="M 14 452 L 14 474 L 36 474" fill="none" stroke="#023c75" stroke-width="2.2"/>
  <path d="M 1164 474 L 1186 474 L 1186 452" fill="none" stroke="#9b0303" stroke-width="2.2"/>

