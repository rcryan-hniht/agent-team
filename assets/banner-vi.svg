      <g transform="translate(0, 102)">
        <rect x="0" y="0" width="276" height="66" rx="4" fill="url(#oaCardBgVi)" stroke="#c5bc9f" stroke-width="1" filter="url(#oaSoftShadowVi)"/>
        <rect x="0" y="0" width="4" height="66" rx="2" fill="#685f10"/>
        <text x="12" y="16" fill="#181811" font-size="11" font-weight="800">04 SEARCHER 🦇</text>
