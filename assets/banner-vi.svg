<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgCanvasVi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080D"/>
      <stop offset="50%" stop-color="#0A0E17"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <linearGradient id="neonCyanVi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="cardBgVi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131A26" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B1019" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="cardOrchBgVi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#132332" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0C141E" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Technical Grid & Patterns -->
    <pattern id="dotGridVi" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B" fill-opacity="0.6"/>
    </pattern>

    <pattern id="crosshairGridVi" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 116 120 L 124 120 M 120 116 L 120 124" stroke="#253246" stroke-width="0.8"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="cyanGlowVi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background Layers -->
  <rect width="1200" height="440" rx="12" fill="url(#bgCanvasVi)"/>
  <rect width="1200" height="440" rx="12" fill="url(#dotGridVi)"/>
  <rect width="1200" height="440" rx="12" fill="url(#crosshairGridVi)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="180" fill="#00F0FF" fill-opacity="0.045"/>
  <circle cx="980" cy="220" r="210" fill="#10B981" fill-opacity="0.04"/>
  <circle cx="600" cy="400" r="160" fill="#A855F7" fill-opacity="0.03"/>

  <!-- Industrial Outer Border -->
  <rect x="14" y="14" width="1172" height="412" rx="8" fill="none" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="14" y="14" width="1172" height="3" rx="1.5" fill="url(#neonCyanVi)"/>

  <!-- High-Precision Corner Markers -->
  <path d="M 14 36 L 14 14 L 36 14" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
  <path d="M 1164 14 L 1186 14 L 1186 36" fill="none" stroke="#10B981" stroke-width="2.5"/>
  <path d="M 14 404 L 14 426 L 36 426" fill="none" stroke="#00F0FF" stroke-width="2.5"/>
  <path d="M 1164 426 L 1186 426 L 1186 404" fill="none" stroke="#10B981" stroke-width="2.5"/>

  <!-- 2. Header Telemetry HUD -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11">
    <!-- CLI Badge -->
    <rect x="36" y="30" width="126" height="26" rx="4" fill="#0A1624" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.7"/>
    <circle cx="48" cy="43" r="3.5" fill="#00F0FF" filter="url(#cyanGlowVi)"/>
    <text x="60" y="47" fill="#00F0FF" font-weight="800" letter-spacing="1">AGT // CLI v3.0</text>

    <!-- Cross-Provider Badge -->
    <rect x="172" y="30" width="206" height="26" rx="4" fill="#0F1722" stroke="#2B394E" stroke-width="1"/>
    <text x="184" y="47" fill="#94A3B8" font-weight="600" letter-spacing="0.8">.AGENTS • .CODEX • .CLAUDE</text>

    <!-- Fallback Engine Badge -->
    <rect x="388" y="30" width="166" height="26" rx="4" fill="#131926" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="400" cy="43" r="3.5" fill="#38BDF8"/>
    <text x="412" y="47" fill="#38BDF8" font-weight="700" letter-spacing="0.5">CHUỖI FALLBACK</text>

    <!-- Process Monitor Badge -->
    <rect x="564" y="30" width="138" height="26" rx="4" fill="#171A21" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="576" cy="43" r="3.5" fill="#F59E0B"/>
    <text x="588" y="47" fill="#F59E0B" font-weight="700" letter-spacing="0.5">GIÁM SÁT AGT PS</text>

    <!-- Workspace Target -->
    <text x="1158" y="47" fill="#64748B" text-anchor="end" font-weight="500" letter-spacing="1">KHÔNG GIAN // ~/PROJECTS</text>
  </g>

  <!-- 3. LEFT COLUMN: Hero Branding & Capability Suite (Tiếng Việt) -->
  <g transform="translate(36, 84)">
    <!-- Monogram Box -->
    <rect x="0" y="4" width="86" height="86" rx="8" fill="#08101C" stroke="#00F0FF" stroke-width="1.8"/>
    <rect x="6" y="10" width="74" height="74" rx="4" fill="none" stroke="#1E2A3A" stroke-width="1"/>
    <text x="43" y="60" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="34" font-weight="900" letter-spacing="-1">agt</text>
    <rect x="22" y="70" width="42" height="3" rx="1.5" fill="url(#neonCyanVi)"/>

    <!-- Title & Tagline -->
    <text x="104" y="42" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="40" font-weight="900" letter-spacing="-0.8">AGENT-TEAM</text>
    <rect x="382" y="18" width="68" height="24" rx="4" fill="#0F2432" stroke="#00F0FF" stroke-width="1"/>
    <text x="416" y="34" text-anchor="middle" fill="#00F0FF" font-family="ui-monospace, monospace" font-size="11.5" font-weight="800" letter-spacing="1">CORE</text>

    <text x="104" y="72" fill="#94A3B8" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13" font-weight="600" letter-spacing="0.4">THIẾT LẬP ĐỘI NGŨ MULTI-AGENT &amp; SKILLS CHO ~/PROJECTS</text>

    <!-- Sleek Neon Divider -->
    <line x1="0" y1="110" x2="570" y2="110" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="109" width="96" height="3" rx="1.5" fill="url(#neonCyanVi)"/>

    <!-- Value Proposition Lines -->
    <text x="0" y="142" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="400">
      Công cụ CLI tương tác phân quyền đội ngũ AI theo từng vai trò độc lập, hỗ trợ
    </text>
    <text x="0" y="166" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="15" font-weight="400">
      chuỗi lùi model đa provider và giữ <tspan fill="#00F0FF" font-family="ui-monospace, monospace" font-weight="700">AGENTS.md &lt; 150 dòng</tspan> chuẩn quốc tế.
    </text>

    <!-- Terminal Command Sandbox -->
    <rect x="0" y="190" width="570" height="52" rx="6" fill="#06090E" stroke="#222F42" stroke-width="1.2"/>
    <circle cx="20" cy="216" r="4" fill="#EF4444"/>
    <circle cx="34" cy="216" r="4" fill="#F59E0B"/>
    <circle cx="48" cy="216" r="4" fill="#10B981"/>
    <text x="68" y="221" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13">
      <tspan fill="#10B981" font-weight="700">$ cd ~/project-example</tspan>
      <tspan fill="#64748B"> &amp;&amp; </tspan>
      <tspan fill="#00F0FF" font-weight="700">agt --lang vi</tspan>
      <tspan fill="#64748B"> || </tspan>
      <tspan fill="#38BDF8">agt fallback</tspan>
    </text>

    <!-- Feature Quick Pills -->
    <g transform="translate(0, 260)" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700">
      <!-- Pill 1: Antigravity -->
      <rect x="0" y="0" width="182" height="34" rx="4" fill="#0B1622" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="16" cy="17" r="4" fill="#00F0FF"/>
      <text x="28" y="21" fill="#E2E8F0">ANTIGRAVITY (`agy`)</text>

      <!-- Pill 2: Codex -->
      <rect x="194" y="0" width="182" height="34" rx="4" fill="#0B1A17" stroke="#10B981" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="210" cy="17" r="4" fill="#10B981"/>
      <text x="222" y="21" fill="#E2E8F0">OPENAI CODEX (`codex`)</text>

      <!-- Pill 3: Claude Code -->
      <rect x="388" y="0" width="182" height="34" rx="4" fill="#1A1412" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="404" cy="17" r="4" fill="#F59E0B"/>
      <text x="416" y="21" fill="#E2E8F0">CLAUDE CODE (`claude`)</text>
    </g>

    <!-- Live Status Metric Footer -->
    <g transform="translate(0, 308)" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">
      <text x="0" y="16">TRẠNG THÁI: <tspan fill="#10B981" font-weight="700">● 5 AGENTS SẴN SÀNG</tspan></text>
      <text x="180" y="16">FALLBACK: <tspan fill="#38BDF8" font-weight="700">ARGON → OPUS → FLASH → SOL</tspan></text>
      <text x="440" y="16">NGÂN SÁCH: <tspan fill="#F59E0B" font-weight="700">&lt;150 DÒNG AGENTS.MD</tspan></text>
    </g>
  </g>

  <!-- Vertical Structural Grid Divider -->
  <line x1="638" y1="68" x2="638" y2="410" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="638" cy="74" r="3" fill="#00F0FF" fill-opacity="0.6"/>
  <circle cx="638" cy="406" r="3" fill="#10B981" fill-opacity="0.6"/>

  <!-- 4. RIGHT COLUMN: 5-Agent Topology & Fallback Architecture (Tiếng Việt) -->
  <g transform="translate(664, 72)" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">
    <!-- Header -->
    <text x="0" y="14" fill="#64748B" font-size="10.5" font-weight="700" letter-spacing="1.2">SƠ ĐỒ 5 AGENTS // ĐIỀU PHỐI &amp; CHUỖI DỰ PHÒNG</text>

    <!-- Connecting Topology Bus Wiring -->
    <path d="M 245 88 L 245 120" stroke="#00F0FF" stroke-width="1.8"/>
    <path d="M 115 120 L 375 120" stroke="#00F0FF" stroke-width="1.4" stroke-opacity="0.7"/>
    <path d="M 115 120 L 115 140" stroke="#00F0FF" stroke-width="1.4" stroke-opacity="0.7"/>
    <path d="M 375 120 L 375 140" stroke="#00F0FF" stroke-width="1.4" stroke-opacity="0.7"/>
    <path d="M 115 220 L 115 240" stroke="#38BDF8" stroke-width="1.4" stroke-opacity="0.7"/>
    <path d="M 375 220 L 375 240" stroke="#10B981" stroke-width="1.4" stroke-opacity="0.7"/>

    <!-- Agent 01: Lead Orchestrator (Top Center) -->
    <g transform="translate(85, 26)">
      <rect x="0" y="0" width="320" height="62" rx="6" fill="url(#cardOrchBgVi)" stroke="#00F0FF" stroke-width="1.6"/>
      <rect x="0" y="0" width="6" height="62" rx="3" fill="#00F0FF"/>
      <circle cx="20" cy="20" r="3.5" fill="#00F0FF"/>
      <text x="32" y="24" fill="#F8FAFC" font-size="13" font-weight="800">01 // ORCHESTRATOR</text>
      <rect x="228" y="10" width="80" height="18" rx="3" fill="#07202B"/>
      <text x="268" y="22" text-anchor="middle" fill="#00F0FF" font-size="9" font-weight="800">KIẾN TRÚC SƯ</text>
      <text x="20" y="42" fill="#94A3B8" font-size="10.5">Argon / Opus 5.5 • Chia task • Điều phối</text>
      <text x="20" y="55" fill="#38BDF8" font-size="9" font-weight="600">FALLBACK: Argon → Opus 5.5 → Flash → Sol 6.1</text>
    </g>

    <!-- Agent 02: Searcher (Middle Left) -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="230" height="80" rx="6" fill="url(#cardBgVi)" stroke="#38BDF8" stroke-width="1.2"/>
      <rect x="0" y="0" width="5" height="80" rx="2.5" fill="#38BDF8"/>
      <circle cx="16" cy="20" r="3.5" fill="#38BDF8"/>
      <text x="28" y="24" fill="#F8FAFC" font-size="12" font-weight="800">02 // SEARCHER</text>
      <rect x="146" y="11" width="72" height="17" rx="3" fill="#081E2E"/>
      <text x="182" y="23" text-anchor="middle" fill="#38BDF8" font-size="8.5" font-weight="700">TRINH SÁT</text>
      <text x="16" y="44" fill="#94A3B8" font-size="10">3.8 Flash Med / Luna Med</text>
      <text x="16" y="58" fill="#64748B" font-size="9.5">Graphify • Tài liệu • Tra cứu</text>
      <text x="16" y="71" fill="#38BDF8" font-size="8.5" font-weight="600">3.8M → 3.8H → Haiku → Luna</text>
    </g>

    <!-- Agent 03: Implementer (Middle Right) -->
    <g transform="translate(260, 140)">
      <rect x="0" y="0" width="230" height="80" rx="6" fill="url(#cardBgVi)" stroke="#10B981" stroke-width="1.2"/>
      <rect x="0" y="0" width="5" height="80" rx="2.5" fill="#10B981"/>
      <circle cx="16" cy="20" r="3.5" fill="#10B981"/>
      <text x="28" y="24" fill="#F8FAFC" font-size="12" font-weight="800">03 // IMPLEMENTER</text>
      <rect x="150" y="11" width="68" height="17" rx="3" fill="#08241A"/>
      <text x="184" y="23" text-anchor="middle" fill="#10B981" font-size="8.5" font-weight="700">THỰC THI</text>
      <text x="16" y="44" fill="#94A3B8" font-size="10">3.8 Flash High / Sol 6.0</text>
      <text x="16" y="58" fill="#64748B" font-size="9.5">TDD • Code &amp; Test tối giản</text>
      <text x="16" y="71" fill="#10B981" font-size="8.5" font-weight="600">3.8H → 3.1P → Sonnet → Sol</text>
    </g>

    <!-- Agent 04: Reviewer (Bottom Left) -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="230" height="80" rx="6" fill="url(#cardBgVi)" stroke="#F59E0B" stroke-width="1.2"/>
      <rect x="0" y="0" width="5" height="80" rx="2.5" fill="#F59E0B"/>
      <circle cx="16" cy="20" r="3.5" fill="#F59E0B"/>
      <text x="28" y="24" fill="#F8FAFC" font-size="12" font-weight="800">04 // REVIEWER</text>
      <rect x="146" y="11" width="72" height="17" rx="3" fill="#241B08"/>
      <text x="182" y="23" text-anchor="middle" fill="#F59E0B" font-size="8.5" font-weight="700">KIỂM ĐỊNH</text>
      <text x="16" y="44" fill="#94A3B8" font-size="10">3.1 Pro High / Sol 6.1 (xhigh)</text>
      <text x="16" y="58" fill="#64748B" font-size="9.5">Kiểm tra 2 trục • Chỉ đọc</text>
      <text x="16" y="71" fill="#F59E0B" font-size="8.5" font-weight="600">3.1P → Opus → 3.8H → Sol 6.1</text>
    </g>

    <!-- Agent 05: Committer (Bottom Right) -->
    <g transform="translate(260, 240)">
      <rect x="0" y="0" width="230" height="80" rx="6" fill="url(#cardBgVi)" stroke="#A855F7" stroke-width="1.2"/>
      <rect x="0" y="0" width="5" height="80" rx="2.5" fill="#A855F7"/>
      <circle cx="16" cy="20" r="3.5" fill="#A855F7"/>
      <text x="28" y="24" fill="#F8FAFC" font-size="12" font-weight="800">05 // COMMITTER</text>
      <rect x="146" y="11" width="72" height="17" rx="3" fill="#20102B"/>
      <text x="182" y="23" text-anchor="middle" fill="#C084FC" font-size="8.5" font-weight="700">ĐÓNG GÓI</text>
      <text x="16" y="44" fill="#94A3B8" font-size="10">3.7 Flash Low / Luna Low</text>
      <text x="16" y="58" fill="#64748B" font-size="9.5">Conventional Git • Clean Diff</text>
      <text x="16" y="71" fill="#C084FC" font-size="8.5" font-weight="600">3.7F → 3.8M → Haiku → Luna</text>
    </g>

    <!-- Command Help Teaser -->
    <g transform="translate(0, 332)" font-size="10" fill="#64748B">
      <rect x="0" y="0" width="490" height="24" rx="4" fill="#0A0E17" stroke="#1E293B" stroke-width="1"/>
      <text x="14" y="16">CÁC LỆNH: <tspan fill="#00F0FF">agt</tspan> • <tspan fill="#10B981">agt init</tspan> • <tspan fill="#38BDF8">agt fallback</tspan> • <tspan fill="#F59E0B">agt ps</tspan> • <tspan fill="#A855F7">agt status</tspan></text>
    </g>
  </g>
</svg>
