      <rect x="0" y="0" width="4" height="72" rx="2" fill="#023c75"/>
      <text x="12" y="18" fill="#181811" font-size="11.5" font-weight="800">01 LEAD ARCHITECT 🦉</text>
      <text x="12" y="34" fill="#68707a" font-size="9.5">owl • Chiến Lược &amp; Đặc Tả Hệ Thống</text>
      <text x="12" y="49" fill="#023c75" font-size="9" font-weight="600">argon (h) • astra (h) • opus [RO]</text>
      <text x="12" y="62" fill="#68707a" font-size="8.5">fallback: →opus→flash→astra</text>
    </g>

