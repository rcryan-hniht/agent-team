        <text x="18" y="38" fill="#4b4f59" font-size="9.5">octopus • Tổng Điều Phối (Không Sửa Code Trực Tiếp) • Điều Hành 4 Subagents</text>
        <text x="18" y="50" fill="#023c75" font-size="8.5" font-weight="600">argon (h) • astra (h) • opus-5.5 [RO]  <tspan fill="#68707a">|  fallback: →opus→sol</tspan></text>
      </g>

      <!-- Dispatcher Tree Lines to 4 Subagents -->
      <path d="M 284 76 L 284 94" stroke="#023c75" stroke-width="1.2"/>
      <path d="M 136 94 L 432 94" stroke="#c8c0ad" stroke-width="1"/>
      <path d="M 136 94 L 136 102" stroke="#c8c0ad" stroke-width="1"/>
      <path d="M 432 94 L 432 102" stroke="#c8c0ad" stroke-width="1"/>

      <!-- 4 Worker Cards (2x2 Grid) -->

