<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 488" width="100%" height="100%">
  <defs>
    <!-- Oasis Starlight Light Background Gradients -->
    <linearGradient id="oaBgCanvasVi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f4ed"/>
      <stop offset="50%" stop-color="#f5f2ea"/>
      <stop offset="100%" stop-color="#eee8da"/>
    </linearGradient>

    <!-- Oasis Starlight Accents & Gradients -->
    <linearGradient id="oaSapphireVi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#023c75"/>
      <stop offset="50%" stop-color="#186aa2"/>
      <stop offset="100%" stop-color="#366e5e"/>
    </linearGradient>

    <linearGradient id="oaCarmineVi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9b0303"/>
      <stop offset="50%" stop-color="#bb141a"/>
      <stop offset="100%" stop-color="#a55512"/>
    </linearGradient>

    <linearGradient id="oaOchreVi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#685f10"/>
      <stop offset="100%" stop-color="#a55512"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="oaCardBgVi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcfbfa" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#f6f3eb" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="oaCardCriticBgVi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf7f7" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#f9efef" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="oaCardOrchBgVi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3f8fc" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#edf4f9" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Technical Warm Desert Dot & Crosshair Patterns -->
    <pattern id="oaDotGridVi" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#cfc7b4" fill-opacity="0.6"/>
    </pattern>

    <pattern id="oaCrosshairGridVi" width="110" height="110" patternUnits="userSpaceOnUse">
      <path d="M 106 110 L 114 110 M 110 106 L 110 114" stroke="#d5ccba" stroke-width="0.8"/>
    </pattern>

    <!-- Subtle Warm Drop Shadow Filter -->
    <filter id="oaSoftShadowVi" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4d4528" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- 1. Background Layers -->
  <rect width="1200" height="488" rx="8" fill="url(#oaBgCanvasVi)"/>
  <rect width="1200" height="488" rx="8" fill="url(#oaDotGridVi)"/>
  <rect width="1200" height="488" rx="8" fill="url(#oaCrosshairGridVi)"/>

  <!-- Ambient Light Orbs (Oasis Starlight Warm/Cool Harmony) -->
  <circle cx="160" cy="110" r="160" fill="#023c75" fill-opacity="0.035"/>
  <circle cx="1060" cy="120" r="170" fill="#9b0303" fill-opacity="0.025"/>
  <circle cx="890" cy="320" r="180" fill="#685f10" fill-opacity="0.03"/>

  <!-- Industrial Outer Border & Starlight Accent Line -->
