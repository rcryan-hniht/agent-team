      <text x="14" y="16">LỆNH: <tspan fill="#023c75" font-weight="700">agt</tspan> • <tspan fill="#181811">agt init</tspan> • <tspan fill="#023c75" font-weight="700">agt status</tspan> • <tspan fill="#9b0303" font-weight="700">agt fallback</tspan> • <tspan fill="#685f10" font-weight="700">agt ps</tspan> • <tspan fill="#1d5c14" font-weight="700">agt list-skills</tspan></text>
