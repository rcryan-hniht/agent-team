      <text x="188" y="14">DỰ PHÒNG: <tspan fill="#023c75" font-weight="700">→OPUS→FLASH→SOL</tspan></text>
      <text x="430" y="14">GIỚI HẠN: <tspan fill="#685f10" font-weight="700">&lt;150L</tspan></text>
    </g>

