        <text x="232" y="16.5" text-anchor="middle" fill="#1d5c14" font-size="8" font-weight="700">TDD [WRITE]</text>
        <text x="12" y="32" fill="#68707a" font-size="9">rabbit • Kỹ Sư TDD Red-Green-Refactor</text>
        <text x="12" y="46" fill="#1d5c14" font-size="8.5">flash-3.8 (h) • sol-6 (xh) • sonnet</text>
        <text x="12" y="58" fill="#868d90" font-size="8">fallback: →pro→sonnet→sol</text>
