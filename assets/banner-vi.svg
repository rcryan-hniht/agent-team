        <text x="12" y="32" fill="#68707a" font-size="9">bat • Trinh Sát Codebase &amp; Tài Liệu</text>
        <text x="12" y="46" fill="#4f4a23" font-size="8.5">flash-3.8 (m) • luna (m) • haiku</text>
        <text x="12" y="58" fill="#868d90" font-size="8">fallback: →haiku→luna</text>
      </g>

